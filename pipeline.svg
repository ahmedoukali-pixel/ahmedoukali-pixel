<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2C9FB7"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#2C9FB7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <line x1="128" y1="65" x2="156" y2="65"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></line>
    <line x1="282" y1="65" x2="310" y2="65"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></line>
    <line x1="436" y1="65" x2="464" y2="65"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></line>
    <line x1="590" y1="65" x2="618" y2="65"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></line>
    <line x1="744" y1="65" x2="772" y2="65"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></line>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <!-- node 1 -->
    <rect x="10" y="38" width="118" height="54" rx="12" fill="#0f2027" stroke="#2C9FB7" stroke-width="2"/>
    <rect x="10" y="38" width="118" height="54" rx="12" fill="#2C9FB7" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="69" y="70">Electronics</text>

    <!-- node 2 -->
    <rect x="164" y="38" width="118" height="54" rx="12" fill="#0f2027" stroke="#2C9FB7" stroke-width="2"/>
    <rect x="164" y="38" width="118" height="54" rx="12" fill="#2C9FB7" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text x="223" y="70">Sensors</text>

    <!-- node 3 -->
    <rect x="318" y="38" width="118" height="54" rx="12" fill="#0f2027" stroke="#2C9FB7" stroke-width="2"/>
    <rect x="318" y="38" width="118" height="54" rx="12" fill="#2C9FB7" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/></rect>
    <text x="377" y="70">Firmware</text>

    <!-- node 4 -->
    <rect x="472" y="38" width="118" height="54" rx="12" fill="#0f2027" stroke="#2C9FB7" stroke-width="2"/>
    <rect x="472" y="38" width="118" height="54" rx="12" fill="#2C9FB7" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect>
    <text x="531" y="70">Signal Proc.</text>

    <!-- node 5 -->
    <rect x="626" y="38" width="118" height="54" rx="12" fill="#0f2027" stroke="#2C9FB7" stroke-width="2"/>
    <rect x="626" y="38" width="118" height="54" rx="12" fill="#2C9FB7" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="3.2s" repeatCount="indefinite"/></rect>
    <text x="685" y="70">AI / ML</text>

    <!-- node 6 -->
    <rect x="780" y="38" width="110" height="54" rx="12" fill="#0f2027" stroke="#2ea44f" stroke-width="2"/>
    <rect x="780" y="38" width="110" height="54" rx="12" fill="#2ea44f" opacity="0"><animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.1;0.2;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
    <text x="835" y="70">Automation</text>
  </g>
</svg>
