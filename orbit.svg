<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3fc1d9"/>
      <stop offset="1" stop-color="#203a43"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#2C9FB7" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="130" cy="130" r="68" stroke-dasharray="4 6"/>
    <circle cx="130" cy="130" r="96"/>
    <circle cx="130" cy="130" r="120" stroke-dasharray="2 8"/>
  </g>

  <!-- orbiting dots -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="8s" repeatCount="indefinite"/>
    <circle cx="198" cy="130" r="7" fill="#2C9FB7"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="14s" repeatCount="indefinite"/>
    <circle cx="34" cy="130" r="6" fill="#2ea44f"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="22s" repeatCount="indefinite"/>
    <circle cx="130" cy="10" r="5" fill="#FF6F00"/>
  </g>

  <!-- core -->
  <circle cx="130" cy="130" r="46" fill="url(#core)">
    <animate attributeName="r" values="46;49;46" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="130" y="143" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">AO</text>
</svg>
