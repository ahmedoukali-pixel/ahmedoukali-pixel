<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c1"><rect x="30" y="62" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="0.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="92" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="1.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="122" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="30" y="152" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="4.2s" dur="2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="30" y="182" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="6.6s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="30" y="212" height="26" width="0"><animate attributeName="width" from="0" to="660" begin="7.8s" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="718" height="268" rx="12" fill="#0d1b22" stroke="#2c5364" stroke-width="2"/>
  <path d="M1 13 Q1 1 13 1 H707 Q719 1 719 13 V38 H1 Z" fill="#16313b"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="360" y="25" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7fa6b3">ahmed@embedded: ~</text>

  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16">
    <g clip-path="url(#c1)"><text x="30" y="82" fill="#2C9FB7">$ <tspan fill="#e6f1f4">whoami</tspan></text></g>
    <g clip-path="url(#c2)"><text x="30" y="112" fill="#a9c6cf">ahmed_oukali · embedded systems engineer</text></g>
    <g clip-path="url(#c3)"><text x="30" y="142" fill="#2C9FB7">$ <tspan fill="#e6f1f4">cat focus.txt</tspan></text></g>
    <g clip-path="url(#c4)"><text x="30" y="172" fill="#a9c6cf">environmental sensing · edge ai · precision agriculture</text></g>
    <g clip-path="url(#c5)"><text x="30" y="202" fill="#2C9FB7">$ <tspan fill="#e6f1f4">status --collab</tspan></text></g>
    <g clip-path="url(#c6)"><text x="30" y="232" fill="#2ea44f">open to collaborate ✓</text></g>
  </g>

  <!-- blinking cursor -->
  <rect x="226" y="217" width="9" height="18" fill="#2C9FB7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="8.8s" repeatCount="indefinite"/>
  </rect>
</svg>
