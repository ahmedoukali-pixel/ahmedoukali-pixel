<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C9FB7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2C9FB7"/>
      <stop offset="1" stop-color="#2C9FB7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#2C9FB7" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="14 10">
    <path d="M0 50 H180 L220 90 H420">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 210 H140 L190 160 H360 L400 200 H520">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 60 H1020 L980 100 H800">
      <animate attributeName="stroke-dashoffset" from="0" to="96" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 215 H1070 L1030 170 H860 L820 205 H700">
      <animate attributeName="stroke-dashoffset" from="0" to="96" dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing nodes -->
  <g fill="#2C9FB7">
    <circle cx="420" cy="90" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="200" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="100" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="205" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="50" r="4"/>
    <circle cx="1020" cy="60" r="4"/>
  </g>

  <!-- text -->
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="2">Ahmed Oukali</text>
  <rect x="300" y="150" width="600" height="3" fill="url(#line)"/>
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#2C9FB7" letter-spacing="1.5">Embedded Systems &amp; Environmental Sensing Engineer</text>
</svg>
